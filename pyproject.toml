[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hiver-spotify-agent"
version = "0.1.0"
description = "AI customer-support agent for Spotify built on real Twitter data"
authors = [{ name = "Aprameya Bharadwaj", email = "aprameya.bharadwaj.05@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "faiss-cpu>=1.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "kaggle>=1.6.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "datasets>=2.19.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "nltk>=3.8.1",
    "textblob>=0.18.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pytest>=8.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
spotify-agent = "scripts.demo:app"
run-eval = "scripts.run_pipeline:run_eval"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*", "scripts*"]
