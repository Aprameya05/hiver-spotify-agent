services:
  - type: web
    name: spotify-support-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app_web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false   # set in Render dashboard, not stored in repo
    healthCheckPath: /health
